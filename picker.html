<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>번호 뽑기</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#f6f3ea;color:#23302b}header{display:flex;align-items:center;gap:14px;padding:14px 20px;background:#23302b;color:#fff}header a{color:#fff;text-decoration:none;font-size:15px;border:1px solid #fff8;border-radius:8px;padding:6px 10px}h1{font-size:22px;margin:0}main{max-width:1000px;margin:0 auto;padding:20px}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:12px 18px;background:#fff;color:#23302b;box-shadow:inset 0 0 0 2px #23302b;cursor:pointer;font-weight:700}button.main{background:#e4572e;color:#fff;box-shadow:none}button:disabled{opacity:.4;cursor:default}input,textarea{border:2px solid #23302b;border-radius:10px;padding:10px;background:#fff}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#n{font-size:min(36vw,260px);font-weight:800;text-align:center;line-height:1.15;color:#e4572e;font-variant-numeric:tabular-nums}.row{justify-content:center}#count{width:90px}#used{text-align:center;font-size:20px;min-height:30px}#left{text-align:center}
</style>
<link rel="stylesheet" href="pastel.css">
</head>
<body>
<header><a href="index.html">도구함</a><h1>번호 뽑기</h1></header>
<main>
<div id="n" aria-live="polite">?</div>
<p id="left"></p>
<p class="row"><button class="main" id="go">뽑기</button><button id="reset">처음부터</button><label>모두 <input id="count" type="number" min="2" max="60" value="25"> 명</label></p>
<p id="used"></p>
</main>
<script>
const $ = i => document.getElementById(i);
let pool = [], used = [], busy = false;
function reset() {
  const c = Math.max(2, Math.min(60, +$('count').value || 2));
  $('count').value = c;
  pool = Array.from({ length: c }, (_, i) => i + 1); used = [];
  $('n').textContent = '?'; show();
}
function show() {
  $('used').textContent = used.length ? '뽑힌 번호: ' + used.join(', ') : '';
  $('left').textContent = '남은 번호 ' + pool.length + '개';
  $('go').disabled = busy || !pool.length;
  $('go').textContent = pool.length ? '뽑기' : '다 뽑았어요';
}
$('go').onclick = () => {
  if (busy || !pool.length) return;
  busy = true; show();
  let t = 0;
  const r = setInterval(() => {
    $('n').textContent = pool[Math.floor(Math.random() * pool.length)];
    if (++t >= 14) {
      clearInterval(r);
      const v = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      used.push(v); $('n').textContent = v; busy = false; show();
    }
  }, 60);
};
$('reset').onclick = () => { if (!busy) reset(); };
$('count').onchange = () => { if (!busy) reset(); };
reset();
</script>
</body>
</html>
