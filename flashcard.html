<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>플래시 카드</title>
<link rel="stylesheet" href="pastel.css">
</head>
<body>
<header><a href="index.html">도구함</a><h1>플래시 카드</h1></header>
<main>
<div class="fc-wrap">
  <div class="fc-progress" id="progress" aria-live="polite">0 / 0</div>
  <div class="flash" id="flash" role="button" tabindex="0" aria-label="카드를 눌러 뜻을 확인해요">
    <div class="inner">
      <div class="face front">
        <span class="tag">ENGLISH</span>
        <div class="word" id="front">단어를 불러오는 중…</div>
        <div class="hint">눌러서 뜻 보기</div>
      </div>
      <div class="face back">
        <span class="tag">뜻</span>
        <div class="word" id="back"></div>
        <div class="hint">다시 눌러 단어 보기</div>
      </div>
    </div>
  </div>
  <p class="row fc-bar"><button id="prev">이전</button><button class="main" id="flip">뒤집기</button><button id="next">다음</button><button id="shuffle">섞기</button><a href="words.html"><button type="button">단어 바꾸기</button></a></p>
  <p style="color:#8a9aa0;font-size:14px">스페이스 키로 뒤집고, ← → 키로 이동할 수 있어요.</p>
</div>
</main>
<script>
const $ = i => document.getElementById(i), KEY = 'class-tools-words';
const SAMPLE = 'apple 사과\nschool 학교\nfriend 친구\nbook 책\nwater 물\nhappy 행복한\nrun 달리다\nthank you 고맙습니다';
let items = [], order = [], pos = 0, flipped = false;

function load() { try { return localStorage.getItem(KEY) || SAMPLE; } catch (e) { return SAMPLE; } }
function parse(t) {
  return t.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^([\x20-\x7e]+?)\s+([^\x20-\x7e].*)$/);
    return m ? { en: m[1], ko: m[2] } : { en: l, ko: '' };
  });
}

function render() {
  const card = $('flash');
  card.classList.remove('flipped');
  flipped = false;
  if (!items.length) {
    $('front').textContent = '단어가 없어요';
    $('back').textContent = '단어 바꾸기에서 추가해 주세요';
    $('progress').textContent = '0 / 0';
    return;
  }
  const it = items[order[pos]];
  $('front').textContent = it.en;
  $('back').textContent = it.ko || '뜻이 없어요';
  $('progress').textContent = (pos + 1) + ' / ' + items.length;
}

function flip() {
  if (!items.length) return;
  flipped = !flipped;
  $('flash').classList.toggle('flipped', flipped);
}

function go(step) {
  if (!items.length) return;
  pos = (pos + step + items.length) % items.length;
  render();
}

function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  render();
}

$('flash').onclick = flip;
$('flip').onclick = flip;
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('shuffle').onclick = shuffle;

document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
});

items = parse(load());
order = items.map((_, i) => i);
render();
</script>
</body>
</html>
